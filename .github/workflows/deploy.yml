name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download portfolio bundle
        run: |
          mkdir site
          curl -fL --retry 3 https://peng-zeyuan-portfolio.salty-ball-2088.chatgpt.site/github-pages-site.tar.gz.part-aa -o site.part-aa
          curl -fL --retry 3 https://peng-zeyuan-portfolio.salty-ball-2088.chatgpt.site/github-pages-site.tar.gz.part-ab -o site.part-ab
          cat site.part-aa site.part-ab > site.tar.gz
          tar -xzf site.tar.gz -C site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

